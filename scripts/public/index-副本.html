<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SES 抑制列表 (Suppression List)</title>
  <style>
    body { font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin: 18px; }
    h1 { margin: 0 0 14px; font-size: 28px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    select,input,button { font-size: 14px; padding: 8px 10px; }
    button { cursor:pointer; }
    table { width:100%; border-collapse: collapse; margin-top: 12px; }
    th,td { border-bottom:1px solid #eee; padding: 10px 8px; font-size: 14px; text-align:left; }
    th { background:#fafafa; }
    .tag { display:inline-block; border:1px solid #ddd; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .tag.red { border-color:#ffb3b3; color:#c00; }
    .tag.green { border-color:#9be7a7; color:#0a7a1f; }
    .muted { color:#666; font-size: 13px; }
    .right { margin-left:auto; display:flex; gap:10px; align-items:center; }
  </style>
  
  <style>
  .btnDanger {
    padding: 6px 10px;
    border: 1px solid #dc2626;
    background: #fff;
    color: #dc2626;
    border-radius: 6px;
    cursor: pointer;
  }
  .btnDanger:disabled {
    opacity: .5;
    cursor: not-allowed;
  }
</style>

  
  <label style="margin-left:12px;">
  注册时间
  <select id="sortCreatedAt">
    <option value="desc">倒序（新→旧）</option>
    <option value="asc">正序（旧→新）</option>
  </select>
</label>

</head>
<body>
  <h1>SES 抑制列表（Suppression List）</h1>

  <div class="row">
    <select id="reason">
      <option value="ALL">全部原因</option>
      <option value="BOUNCE">Bounce</option>
      <option value="COMPLAINT">Complaint</option>
    </select>

    <input id="q" placeholder="搜索邮箱关键词（contains）" style="min-width: 260px;" />

    <label class="muted"><input id="hitOnly" type="checkbox" /> 只看命中用户</label>

    <div class="right">
      <label class="muted">每页
        <select id="pageSize">
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
      </label>

      <button id="btnLoad">加载</button>
      <button id="btnNext" disabled>下一页</button>
      <button id="btnExport" disabled>导出本页 CSV</button>
      <span id="status" class="muted"></span>
      <span id="err" class="muted"></span>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:26%">邮箱</th>
        <th style="width:10%">原因</th>
        <th style="width:20%">更新时间</th>
        <th style="width:10%">命中用户</th>
        <th style="width:8%">用户ID</th>
        <th style="width:8%">封禁</th>
        <th style="width:10%">操作</th>
        <th style="width:18%">注册时间(created_at)</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

<script>
(() => {
  // 关键：用相对路径，确保在 /ses/ 下访问时走 /ses/api/... -> 9010
  const API_LIST = 'api/ses/suppressions';

  const el = (id) => document.getElementById(id);
  const tbody = el('tbody');
  const statusEl = el('status');
  const errEl = el('err');

  let nextToken = null;
  let lastRows = [];

  function setErr(msg) { errEl.textContent = msg ? ('错误：' + msg) : ''; }
  function setStatus(msg) { statusEl.textContent = msg || ''; }

  function fmtTs(ts) {
    if (!ts) return '';
    // 后端给的是 int(秒)；这里用本地时间显示
    const d = new Date(ts * 1000);
    return d.toLocaleString();
  }

  function escapeCsv(s) {
    s = (s ?? '').toString();
    if (/[,"\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }

  function render(rows) {
  tbody.innerHTML = '';
  for (const r of rows) {
    const tr = document.createElement('tr');

    const hitTag = r.hit_user
      ? '<span class="tag green">命中</span>'
      : '<span class="tag">否</span>';

    const bannedTag =
      (r.user_banned === 1 || r.user_banned === true)
        ? '<span class="tag red">是</span>'
        : '<span class="tag green">否</span>';

    // 仅命中用户显示“禁用”按钮；已禁用则灰掉
    const canDisable = !!r.hit_user && !(r.user_banned === 1 || r.user_banned === true);
    const disableBtn = r.hit_user
      ? `<button
            class="btnDanger"
            data-disable="1"
            data-uid="${r.user_id ?? ''}"
            data-email="${encodeURIComponent(r.email || '')}"
            ${canDisable ? '' : 'disabled'}
         >${canDisable ? '一键禁用' : '已禁用'}</button>`
      : '';

    tr.innerHTML = `
      <td>${r.email || ''}</td>
      <td><span class="tag red">${r.reason || ''}</span></td>
      <td>${r.last_update_time || ''}</td>
      <td>${hitTag}</td>
      <td>${r.user_id ?? ''}</td>
      <td>${r.hit_user ? bannedTag : ''}</td>
      <td>${r.hit_user ? fmtTs(r.user_created_at) : ''}</td>
      <td>${disableBtn}</td>
    `;
    tbody.appendChild(tr);
  }
}


 async function loadPage(isNext) {
  setErr('');
  setStatus('加载中...');
  el('btnLoad').disabled = true;
  el('btnNext').disabled = true;
  el('btnExport').disabled = true;

  const reason = el('reason').value;
  const q = el('q').value.trim();
  const hitOnly = el('hitOnly').checked;
  const pageSize = parseInt(el('pageSize').value, 10) || 50;

  // 新增：注册时间排序
  const sortCreatedAtEl = document.getElementById('sortCreatedAt');
  const sortCreatedAt = sortCreatedAtEl ? (sortCreatedAtEl.value || 'desc') : 'desc';

  const params = new URLSearchParams();
  params.set('reason', reason);
  params.set('q', q);
  params.set('hit_only', hitOnly ? '1' : '0');
  params.set('page_size', String(pageSize));
  params.set('sort_created_at', sortCreatedAt); // ✅ 新增
  if (isNext && nextToken) params.set('cursor', nextToken);

  try {
    const url = API_LIST + '?' + params.toString();
    const resp = await fetch(url, { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || data.detail || 'backend not ok');

    nextToken = data.next_token || null;
    lastRows = data.rows || [];

    render(lastRows);
    setStatus(`当前返回 ${lastRows.length} 条（${nextToken ? '还有下一页' : '末页/无更多'}）`);

    el('btnNext').disabled = !nextToken;
    el('btnExport').disabled = lastRows.length === 0;
  } catch (e) {
    setErr(e && e.message ? e.message : 'unknown');
    setStatus('');
    render([]);
  } finally {
    el('btnLoad').disabled = false;
  }
}


  function exportCsv() {
    const header = ['email','reason','last_update_time','hit_user','user_id','user_email','user_banned','user_created_at','user_last_login_ip'];
    const lines = [header.join(',')];
    for (const r of lastRows) {
      lines.push([
        escapeCsv(r.email),
        escapeCsv(r.reason),
        escapeCsv(r.last_update_time),
        escapeCsv(r.hit_user ? 1 : 0),
        escapeCsv(r.user_id),
        escapeCsv(r.user_email),
        escapeCsv(r.user_banned),
        escapeCsv(r.user_created_at),
        escapeCsv(r.user_last_login_ip),
      ].join(','));
    }
    const blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ses_suppression_page.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  el('btnLoad').addEventListener('click', () => loadPage(false));
  el('btnNext').addEventListener('click', () => loadPage(true));
  el('btnExport').addEventListener('click', exportCsv);

  // 回车触发加载
  el('q').addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') loadPage(false);
  });

  // 首次不自动加载，避免你说的“页面打开很慢”
})();


document.addEventListener('click', async (ev) => {
  const btn = ev.target && ev.target.closest && ev.target.closest('button[data-disable="1"]');
  if (!btn) return;

  const userId = btn.getAttribute('data-uid');
  const email = decodeURIComponent(btn.getAttribute('data-email') || '');
  if (!userId) return;

  if (!confirm(`确认禁用用户？\nuser_id=${userId}\nemail=${email}`)) return;

  // 最保守：每次 prompt 输入 token（你也可以改成 localStorage）
  let token = localStorage.getItem('sesAdminToken') || '';
  token = prompt('请输入 ADMIN_TOKEN（用于授权禁用）', token || '') || '';
  token = token.trim();
  if (!token) return;
  localStorage.setItem('sesAdminToken', token);

  try {
    btn.disabled = true;

    const resp = await fetch('/api/users/disable', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Admin-Token': token,
      },
      body: JSON.stringify({ user_id: parseInt(userId, 10), email }),
    });

    const data = await resp.json().catch(() => null);
    if (!resp.ok || !data || !data.ok) {
      const msg = (data && (data.detail || data.error)) || ('HTTP ' + resp.status);
      throw new Error(msg);
    }

    // 本地把当前行标记为已禁用（避免再点一次）
    btn.textContent = '已禁用';
    btn.disabled = true;

    // 同时更新当前 lastRows，刷新渲染更一致
    for (const r of lastRows) {
      if (String(r.user_id ?? '') === String(userId)) {
        r.user_banned = 1;
      }
    }
    render(lastRows);
    setStatus(`已禁用 user_id=${userId}`);
  } catch (e) {
    setErr('禁用失败：' + (e && e.message ? e.message : 'unknown'));
  } finally {
    // 已禁用保持 disabled；失败则恢复可点
    if (btn.textContent !== '已禁用') btn.disabled = false;
  }
});

</script>
</body>
</html>
